name: WorldRadio
options:
  bundleIdPrefix: com.worldradio
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: WorldRadio/Supporting/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  WorldRadio:
    type: application
    platform: iOS
    sources:
      - path: WorldRadio
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worldradio.app
        INFOPLIST_FILE: WorldRadio/Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: WorldRadio/Supporting/Info.plist
      properties:
        CFBundleDisplayName: World Radio
